name: taytay_resident
description: "Taytay, Rizal LGU IDS — official resident mobile app (citizen-mobile channel)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0

  # Localisation. Both ship with the Flutter SDK, so neither adds a third-party
  # maintainer, a permission, or a byte of data egress — the Article 1 review is
  # short because there is nothing outside the SDK to review.
  #
  # `flutter_localizations` supplies Material's own translated widget strings
  # (the date picker, "Back", "Show menu") for every locale this app declares.
  # Without it a Filipino build would show translated app copy inside untranslated
  # Material chrome. `intl` supplies the plural and date machinery `gen-l10n`
  # generates against.
  flutter_localizations:
    sdk: flutter
  intl: any

  # HTTP transport. Dart-team maintained, minimal surface, no code generation and
  # no interceptor framework of its own — retry, auth and correlation are this
  # app's own policy in `core/api/`, where they are unit-testable, rather than
  # configuration inside a third-party client. Chosen over dio for the same
  # reason: fewer moving parts in the layer that carries resident credentials.
  http: ^1.6.0

  # Platform keystore for credential material: Android Keystore via
  # EncryptedSharedPreferences, iOS Keychain. Required by CLAUDE.md Article 5.3,
  # which forbids tokens in plain `SharedPreferences` or a plain file. Configured
  # in `core/storage/secure_secret_store.dart` with device-only accessibility so
  # a token cannot travel to another device in a cloud backup.
  flutter_secure_storage: ^11.0.0

  # Local device unlock (fingerprint, face, or the device PIN/pattern) used for
  # ONE purpose: re-showing an app that is already signed in, after it has been
  # backgrounded. Reviewed against CLAUDE.md Article 1 before adding.
  #
  # * Maintenance — part of flutter/packages, maintained by the Flutter team
  #   alongside the SDK, so it tracks platform API deprecations.
  # * Permissions — Android `USE_BIOMETRIC` only; no camera, no storage, no
  #   contacts. iOS needs `NSFaceIDUsageDescription`.
  # * Data egress — none. The plugin returns a boolean from the platform's own
  #   prompt. No biometric template ever reaches Dart, this app, or the network;
  #   templates stay in the Secure Enclave / TEE and are not readable by apps.
  # * Authority — a local unlock proves possession of *this device*, not
  #   identity. It is never sent to the server, never stored, and never changes
  #   an access level. See `core/session/app_lock_controller.dart`.
  local_auth: ^3.0.2

  # Camera capture and gallery selection for the documents a municipal office
  # asks for. Reviewed against CLAUDE.md Article 1 before adding.
  #
  # * Maintenance — part of flutter/packages, maintained by the Flutter team
  #   alongside the SDK.
  # * Permissions — Android needs `CAMERA` only for the camera path; gallery
  #   selection goes through the system photo picker, which grants access to the
  #   single chosen item rather than the whole library, so no broad media
  #   permission is declared. iOS needs `NSCameraUsageDescription` and
  #   `NSPhotoLibraryUsageDescription`.
  # * Data egress — none by the plugin. It returns a file the app then uploads
  #   deliberately, through this app's own client.
  # * Why it, and not a camera package — the platform pickers are the surface a
  #   resident already knows, they handle permission prompts and the photo-picker
  #   flow correctly per OS version, and re-encoding happens natively, which is
  #   what makes the readability floor in `core/documents/` affordable on the
  #   mid-range phones most residents carry.
  image_picker: ^1.2.0

  # Choosing an existing document — most often a PDF the barangay issued — which
  # the image pickers above cannot see.
  #
  # * Maintenance — part of flutter/packages.
  # * Permissions — none. It uses the OS document provider, which hands back one
  #   user-chosen file and no directory access.
  # * Data egress — none.
  file_selector: ^1.0.3

  # The OS share sheet, so a resident can pass a municipal advisory to a
  # neighbour through whichever app they already use. Reviewed against
  # CLAUDE.md Article 1 before adding.
  #
  # * Maintenance — `fluttercommunity/plus_plugins`, the most widely used share
  #   plugin in the ecosystem and the de-facto standard. Not flutter/packages:
  #   the Flutter team publishes no share plugin, so there is no first-party
  #   option to prefer.
  # * Permissions — none on either platform. It hands text to the system sheet.
  # * Data egress — none by the plugin. What leaves the device is exactly what
  #   the resident chose to send, to the app they chose to send it with.
  # * Scope — used for one thing: sharing a *public* announcement. Nothing
  #   personal is ever passed to it, and `ShareService` wraps it so no screen
  #   calls the plugin directly and a device without a share sheet degrades to
  #   copying the text instead.
  #
  # Pinned at ^13 rather than ^12: the older line depends on `win32 ^5`, which
  # conflicts with `flutter_secure_storage`'s `win32 ^6`. Downgrading the secure
  # storage to resolve it was the other option and was rejected — that package
  # holds this app's credential material, and a share sheet is not a reason to
  # move it backwards.
  share_plus: ^13.3.0

  # Opening a map link for a municipal venue in whichever maps app the resident
  # already uses. Reviewed against CLAUDE.md Article 1 before adding.
  #
  # * Maintenance — part of flutter/packages, maintained by the Flutter team.
  # * Permissions — none. Android needs a `<queries>` entry to *see* browsers,
  #   which is declared in the manifest and grants nothing.
  # * Data egress — none by the plugin. It hands a URL to the OS.
  # * Scope and safety — used for one thing: a directions link the **server**
  #   supplied for a public venue. `ExternalLinkService` refuses anything that
  #   is not `https`, so a compromised or mistaken payload cannot open a
  #   `javascript:`, `intent:` or `file:` URI, and no screen calls the plugin
  #   directly.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Test-only. Computes the SHA-256 that `test/core/brand_test.dart` checks
  # official artwork against, so a re-exported or swapped seal fails a test
  # instead of shipping unnoticed. Dart-team maintained, pure Dart, no platform
  # channels and no network access. Deliberately a dev dependency: it is never
  # linked into the shipped app.
  crypto: ^3.0.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates `AppLocalizations` from `lib/l10n/*.arb`, configured in `l10n.yaml`.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
