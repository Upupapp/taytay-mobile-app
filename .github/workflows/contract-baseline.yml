name: Backend baseline

# TAB 00's staleness guard, and the first CI this repository has had.
#
# Two jobs because the two halves fail for different reasons and a human needs to
# know which. `baseline-agrees-with-code` catches this repository drifting from
# its own document and needs nothing but the checkout. `baseline-agrees-with-backend`
# catches the backend moving underneath the pinned tag, and needs the backend repo.
#
# The nightly schedule matters as much as the pull-request trigger: the failure this
# guards against did not arrive in a pull request. It arrived by the backend
# advancing forty-five commits while this repository sat still, and nothing here
# would ever have run to notice.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 21:00 UTC = 05:00 Asia/Manila, so a red result is waiting at the start of
    # the working day in Taytay rather than at the end of it.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  baseline-agrees-with-code:
    name: Committed baseline agrees with the enums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/integration/backend_baseline_test.dart

  contract-conformance:
    name: The app matches the published contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  fixture-drift:
    name: Staging still sends what it publishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exit 3 is "skipped, loudly" — no staging URL configured, or nothing
      # recorded yet. Surfaced as a warning annotation rather than a green tick,
      # because a check that passes when it could not run reports proof it does
      # not have. It is the state at TAB 01 and it must stay visible until a
      # staging environment exists.
      - name: Re-fetch every recorded fixture
        env:
          TAYTAY_STAGING: ${{ secrets.TAYTAY_STAGING }}
        run: |
          set +e
          ./tool/check_fixture_drift.sh
          code=$?
          set -e
          if [ $code -eq 3 ]; then
            echo "::warning title=Fixture drift not proven::No staging API or no recorded fixtures. This is not a pass."
            exit 0
          fi
          exit $code

  release-hardening:
    name: The artifact is hardened, not just the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # A build file can say one thing while the thing it produces says another.
      # This reads the APK: cleartext, the permission set, the signing
      # certificate, and anything secret-shaped in the bundle.
      - name: Build a release artifact
        run: flutter build apk --release --dart-define=TAYTAY_ENV=prod

      # EXPECTED RED until TAB 21 establishes signing key custody (F03). Surfaced
      # as a warning rather than a hard failure *only* for that one finding, and
      # the annotation says which — a gate that is red for a known reason and
      # silent about it is a gate people stop reading.
      - name: Check the artifact
        run: |
          set +e
          out=$(./tool/check_release_hardening.sh 2>&1)
          code=$?
          echo "$out"
          set -e
          if [ $code -ne 0 ] && [ "$(echo "$out" | grep -c 'FAIL:')" = "1" ] \
             && echo "$out" | grep -q 'ANDROID DEBUG KEY'; then
            echo "::warning title=F03 open::Release artifact is debug-signed. Expected until TAB 21."
            exit 0
          fi
          exit $code

  dependency-advisories:
    name: Dependency surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Reported, not gated. Dart has no first-party advisory database to fail a
      # build against, and a gate that cannot distinguish severity would be
      # switched off within a month. Reviewed at each release instead — see
      # docs/integration/security-decisions.md.
      - run: flutter pub outdated --show-all

  baseline-agrees-with-backend:
    name: Committed baseline agrees with the backend at its tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetch tags: the guard refuses a baseline that is not an existing tag, and
      # a shallow checkout without tags would fail for the wrong reason.
      - name: Check out the backend at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: Upupapp/taytay-backend
          path: .backend
          fetch-depth: 0

      - name: Compare module status
        env:
          TAYTAY_BACKEND: ${{ github.workspace }}/.backend
        run: ./tool/check_backend_baseline.sh
